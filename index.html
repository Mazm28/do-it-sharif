<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Do It</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Colorful light (default) */
  :root {
    --bg: #f4f1ec; --bg2: #ece6f6; --card: #ffffff; --solid: #ffffff;
    --text: #1d1b26; --muted: #7a7686; --line: #e9e5ef;
    --accent: #6c5ce7; --accent-soft: #6c5ce71a; --on-accent: #fff;
    --danger: #e0475b; --danger-soft: #e0475b1a;
    --warn: #d98a00; --warn-soft: #f5a6231f;
    --shadow: 0 1px 2px #1d1b260d, 0 8px 24px #1d1b260f;
  }
  /* Dark: follows the system, unless the user picked a mode */
  @media (prefers-color-scheme: dark) {
    :root:not([data-mode=light]) {
      --bg: #13121a; --bg2: #1c1830; --card: #1f1d2a; --solid: #24222f;
      --text: #ecebf2; --muted: #9a97a8; --line: #2f2c3d;
      --accent: #9b8cff; --accent-soft: #9b8cff22;
      --danger: #ff6b7d; --danger-soft: #ff6b7d22;
      --warn: #ffb547; --warn-soft: #ffb54722;
      --shadow: 0 1px 2px #0006, 0 8px 24px #0005;
    }
  }
  :root[data-mode=dark] {
    --bg: #13121a; --bg2: #1c1830; --card: #1f1d2a; --solid: #24222f;
    --text: #ecebf2; --muted: #9a97a8; --line: #2f2c3d;
    --accent: #9b8cff; --accent-soft: #9b8cff22;
    --danger: #ff6b7d; --danger-soft: #ff6b7d22;
    --warn: #ffb547; --warn-soft: #ffb54722;
    --shadow: 0 1px 2px #0006, 0 8px 24px #0005;
  }
  /* Minimal: no course colors, plain background, ink accent */
  :root[data-style=minimal] {
    --bg: #f6f6f4; --bg2: #f6f6f4; --line: #e7e7e4; --muted: #77767c;
    --accent: #1f1e24; --accent-soft: #1f1e240f; --on-accent: #fff;
    --shadow: 0 1px 2px #0000000a;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-style=minimal]:not([data-mode=light]) {
      --bg: #121214; --bg2: #121214; --card: #1b1b1e; --solid: #202024; --line: #2c2c31; --muted: #93939a;
      --accent: #ececee; --accent-soft: #ececee14; --on-accent: #151517;
      --shadow: 0 1px 2px #0005;
    }
  }
  :root[data-style=minimal][data-mode=dark] {
    --bg: #121214; --bg2: #121214; --card: #1b1b1e; --solid: #202024; --line: #2c2c31; --muted: #93939a;
    --accent: #ececee; --accent-soft: #ececee14; --on-accent: #151517;
    --shadow: 0 1px 2px #0005;
  }
  [data-style=minimal] .course, [data-style=minimal] .dot { --c: var(--accent) !important; }
  [data-style=minimal] .course::before { display: none; }
  [data-style=minimal] .dots .dot { --c: var(--muted) !important; }

  * { box-sizing: border-box; }
  /* Persian names keep their own direction but line up with the English UI */
  [dir=auto] { text-align: left; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font: 16px/1.5 "Vazirmatn", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg) radial-gradient(1200px 600px at 100% -10%, var(--bg2), transparent) fixed;
    transition: background-color .2s;
  }
  main { max-width: 1520px; margin: 0 auto; padding: 36px 32px 72px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 24px; }
  header .today { color: var(--muted); font-size: 14px; font-weight: 500; letter-spacing: .02em; }
  header h1 { font-size: 40px; font-weight: 800; margin: 2px 0 0; letter-spacing: -.02em; line-height: 1.2; }
  header h1 span { color: var(--accent); }
  header .summary { color: var(--muted); margin-top: 2px; }
  .tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .round {
    width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: var(--card); color: var(--text); border: 1px solid var(--line); box-shadow: var(--shadow);
    font-size: 18px; transition: border-color .15s;
  }
  .round:hover { border-color: var(--accent); }

  input[type=text] {
    font: inherit; color: inherit; background: var(--solid);
    border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 14px; min-width: 0;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  button { font: inherit; cursor: pointer; border: 0; }
  .btn {
    border-radius: 12px; padding: 11px 18px; font-weight: 600;
    background: var(--accent); color: var(--on-accent); transition: transform .1s, filter .15s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(.97); }

  .row { display: flex; gap: 8px; }
  #add-course {
    background: var(--card); padding: 8px;
    border-radius: 18px; box-shadow: var(--shadow); border: 1px solid var(--line);
  }
  #add-course input { flex: 1; border-color: transparent; background: transparent; }
  #add-course input:focus { box-shadow: none; }

  /* Courses fill the width in as many columns as fit */
  #courses {
    display: grid; gap: 18px; margin-top: 18px; align-items: start;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr));
  }
  .course {
    --c: var(--accent);
    position: relative; overflow: hidden;
    background: var(--card);
    border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
    padding: 20px 20px 16px;
  }
  .course::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--c); }
  .course-head { display: flex; align-items: center; gap: 12px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; }
  .course-head h2 { font-size: 19px; font-weight: 700; margin: 0; flex: 1; overflow-wrap: anywhere; }
  .count { color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; }
  .progress { height: 6px; border-radius: 99px; background: var(--line); margin: 12px 0 8px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--c); border-radius: inherit; transition: width .6s cubic-bezier(.22, 1, .36, 1); }

  .icon-btn {
    background: none; color: var(--muted); border-radius: 8px; padding: 4px 8px; font-size: 14px;
    opacity: .6; transition: opacity .15s, color .15s, background .15s;
  }
  .icon-btn:hover { opacity: 1; color: var(--danger); background: var(--danger-soft); }

  ul { list-style: none; margin: 0 0 12px; padding: 0; }
  .course li {
    display: flex; align-items: center; gap: 12px; padding: 9px 6px;
    border-bottom: 1px dashed var(--line); border-radius: 10px;
  }
  .course li:last-child { border-bottom: 0; }
  .course li:hover { background: var(--accent-soft); }
  .course li:not(:hover) .icon-btn { opacity: 0; }
  .check {
    width: 22px; height: 22px; border-radius: 50%; flex: none; padding: 0;
    border: 2px solid var(--muted); background: none; display: grid; place-items: center;
    transition: background .15s, border-color .15s;
  }
  .check:hover { border-color: var(--c); }
  li.done .check { background: var(--c); border-color: var(--c); }
  li.done .check::after { content: ""; width: 6px; height: 10px; border: solid var(--on-accent); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
  [data-style=colorful] li.done .check::after { border-color: #fff; }
  li .name { flex: 1; overflow-wrap: anywhere; color: inherit; text-decoration: none; }
  li a.name:hover { color: var(--c); text-decoration: underline; }
  li.done .name { text-decoration: line-through; color: var(--muted); }

  .sync {
    display: inline-flex; align-items: center; gap: 10px; max-width: 100%; flex-wrap: wrap;
    padding: 5px 6px 5px 14px; border-radius: 18px; font-size: 13px; color: var(--muted);
    background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .sync .source { display: inline-flex; gap: 6px; overflow-wrap: anywhere; }
  .sync .source + .source { padding-inline-start: 10px; border-inline-start: 1px solid var(--line); }
  .sync b { color: var(--text); }
  .sync .bad, .sync a { color: var(--danger); }
  .sync button {
    background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600;
    padding: 4px 12px; border-radius: 99px;
  }
  .sync button:disabled { opacity: .6; cursor: default; }

  .due {
    font-size: 12.5px; font-weight: 600; white-space: nowrap;
    padding: 3px 10px; border-radius: 99px; color: var(--muted); background: var(--line);
  }
  .due.overdue { color: var(--danger); background: var(--danger-soft); }
  .due.late { color: #fff; background: var(--danger); cursor: help; }
  .due.soon { color: var(--warn); background: var(--warn-soft); }
  li.done .due { color: var(--muted); background: transparent; }

  form.task input[type=text] { flex: 1; }
  .date-btn {
    border-radius: 12px; padding: 0 14px; white-space: nowrap; font-weight: 500;
    background: var(--solid); color: var(--muted); border: 1.5px solid var(--line);
  }
  .date-btn.set { color: var(--c); border-color: var(--c); }
  form.task .btn { background: var(--c); color: #fff; }
  [data-style=minimal] form.task .btn { color: var(--on-accent); }

  .empty { grid-column: 1 / -1; text-align: center; padding: 56px 16px; color: var(--muted); }
  .empty .big { font-size: 44px; }
  .muted { color: var(--muted); }

  /* Popovers: Jalali date picker and theme menu */
  .picker, .theme-menu {
    position: absolute; z-index: 10; padding: 14px;
    background: var(--solid); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 20px 50px #0003;
  }
  .picker { width: 300px; }
  .picker-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .picker-head strong { font-weight: 700; }
  .picker-head button { background: none; color: var(--text); width: 32px; height: 32px; border-radius: 8px; font-size: 18px; }
  .picker-head button:hover { background: var(--accent-soft); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .grid .wd { font-size: 12px; color: var(--muted); padding: 4px 0; font-weight: 600; }
  .grid .wd.fri { color: var(--danger); }
  .grid button { background: none; color: var(--text); aspect-ratio: 1; border-radius: 10px; font-size: 14px; }
  .grid button:hover { background: var(--accent-soft); }
  .grid button.today { color: var(--accent); font-weight: 800; }
  .grid button.sel { background: var(--accent); color: var(--on-accent); }
  .picker-foot { display: flex; justify-content: space-between; margin-top: 8px; }
  .picker-foot button { background: none; color: var(--accent); font-weight: 600; padding: 6px 10px; border-radius: 8px; }
  .picker-foot button:hover { background: var(--accent-soft); }
  .theme-menu { display: grid; gap: 12px; font-size: 14px; }
  .seg-row { display: grid; gap: 6px; }
  .seg-row > span { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .seg { display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--line); }
  .seg button { flex: 1; padding: 6px 12px; border-radius: 9px; background: none; color: var(--muted); font-weight: 600; font-size: 13px; }
  .seg button.on { background: var(--solid); color: var(--text); box-shadow: 0 1px 3px #0002; }

  .update {
    display: flex; align-items: center; gap: 10px; width: fit-content; max-width: 100%; margin: -8px 0 20px;
    padding: 8px 8px 8px 14px; border-radius: 14px; text-decoration: none; font-size: 14px; font-weight: 600;
    color: var(--on-accent); background: var(--accent); box-shadow: var(--shadow);
  }
  .update span:last-child { background: #ffffff33; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
  .update:hover { filter: brightness(1.08); }

  /* Sidebar: month calendar and the week ahead */
  .side { display: grid; gap: 18px; }
  .panel { padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-head button { background: none; color: var(--text); width: 32px; height: 32px; border-radius: 8px; font-size: 18px; }
  .cal-head strong { font-weight: 700; padding: 4px 10px; border-radius: 8px; cursor: pointer; }
  .cal-head button:hover, .cal-head strong:hover { background: var(--accent-soft); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-grid .wd { font-size: 12px; color: var(--muted); font-weight: 600; padding: 2px 0 6px; }
  .cal-grid .wd.fri { color: var(--danger); }
  .day {
    aspect-ratio: 1; border-radius: 10px; font-size: 14px; outline: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  }
  .day.past .num { color: var(--muted); }
  .day.has { cursor: pointer; }
  .day.has:hover, .day.has:focus-visible { background: var(--accent-soft); }
  .day.today, .day.today:hover { background: var(--accent); }
  .day.today .num { color: var(--on-accent); font-weight: 700; }
  .dots { display: flex; gap: 2px; height: 6px; align-items: center; }
  .dots .dot { width: 6px; height: 6px; }
  .dots .dot.done { opacity: .35; }
  .day.today .dots .dot { box-shadow: 0 0 0 1.5px var(--on-accent); }
  .dots small { font-size: 9px; line-height: 1; color: var(--muted); }
  .day.today .dots small { color: var(--on-accent); }

  #upcoming h3 { margin: 0 0 6px; font-size: 16px; font-weight: 700; }
  #upcoming p { margin: 4px 0; font-size: 14px; }
  .up-list { margin: 0; }
  .up-day {
    margin-top: 10px; padding-bottom: 2px; font-size: 12px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em;
  }
  .up-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .up-item:last-child { border-bottom: 0; }
  .up-item .dot { width: 8px; height: 8px; }
  .up-text { flex: 1; min-width: 0; }
  .up-name { display: block; font-size: 14px; font-weight: 600; color: inherit; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a.up-name:hover { text-decoration: underline; }
  .up-item .t-course { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up-item .due { font-size: 12px; padding: 2px 8px; }

  .tip {
    position: fixed; z-index: 20; width: 260px; padding: 12px 14px; font-size: 14px; pointer-events: none;
    background: var(--solid); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 50px #0003;
  }
  .tip strong { display: block; margin-bottom: 4px; }
  .tip-item { display: flex; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--line); }
  .tip-item .dot { width: 8px; height: 8px; margin-top: 7px; }
  .tip-item div { min-width: 0; overflow-wrap: anywhere; }
  .tip-item.done .t-name { text-decoration: line-through; color: var(--muted); }
  .t-course { font-size: 12px; color: var(--muted); }

  @media (max-width: 1000px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .side { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); align-items: start; }
  }
  @media (max-width: 560px) {
    main { padding: 24px 16px 56px; }
    header h1 { font-size: 32px; }
    form.task { flex-wrap: wrap; }
    form.task input[type=text] { flex-basis: 100%; }
    form.task .date-btn { flex: 1; padding: 11px 14px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="today" id="today"></div>
      <h1 id="title">Do It<span>.</span></h1>
      <div class="summary" id="summary"></div>
    </div>
    <div class="tools">
      <div id="sync" hidden></div>
      <button class="round" id="theme" type="button" aria-label="Theme">◐</button>
    </div>
  </header>
  <a id="update" hidden target="_blank" rel="noopener"></a>
  <div class="layout">
    <section>
      <form class="row" id="add-course">
        <input type="text" id="course-name" required dir="auto">
        <button class="btn" id="add-course-btn"></button>
      </form>
      <div id="courses"></div>
    </section>
    <aside class="side">
      <div class="panel" id="calendar"></div>
      <div class="panel" id="upcoming"></div>
    </aside>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
